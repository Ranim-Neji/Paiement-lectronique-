<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>SSL/TLS et le paiement électronique</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#12061a;--bg2:#2b0f35;--be:#e0409a;--li:#d9c6ec;--mu:#e6b43a;--iv:#f6ecdc;--pl:#6b2d5c;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;overflow:hidden;background:var(--bg);color:var(--iv);font:16px/1.45 'Space Grotesk',system-ui,sans-serif}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 20% 10%,#5a1d63 0,transparent 45%),radial-gradient(circle at 85% 90%,#8a1f63 0,transparent 40%),linear-gradient(rgba(217,198,236,.06) 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,rgba(217,198,236,.06) 1px,transparent 1px) 0 0/48px 48px;animation:gr 20s linear infinite}
@keyframes gr{to{background-position:0 0,0 0,0 48px,48px 0}}
.stage{position:absolute;inset:0;perspective:1800px;overflow:hidden}
.slide{position:absolute;inset:0;padding:64px 6vw 90px;overflow:auto;display:flex;transition:transform 1s cubic-bezier(.7,0,.2,1),opacity .8s;transform-origin:center;opacity:0;pointer-events:none}
.slide.cur{opacity:1;transform:none;pointer-events:auto}.slide.prev{transform:translateX(-70%) rotateY(55deg) scale(.7)}.slide.next{transform:translateX(70%) rotateY(-55deg) scale(.7)}
.in{margin:auto;width:100%;max-width:1150px;display:flex;flex-direction:column;gap:20px}
.tag{font:700 12px 'JetBrains Mono',monospace;color:var(--mu);letter-spacing:.2em;text-transform:uppercase}
h1,h2{font-weight:700;line-height:1.05;letter-spacing:-.02em}h1{font-size:clamp(40px,7vw,92px);background:linear-gradient(90deg,var(--iv),var(--be));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:clamp(26px,3.8vw,46px)}h2 em{color:var(--be);font-style:normal}
.g{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.c{--rx:0deg;--ry:0deg;padding:20px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid rgba(224,64,154,.45);backdrop-filter:blur(8px);box-shadow:0 0 24px rgba(224,64,154,.15);transform:perspective(700px) rotateX(var(--rx)) rotateY(var(--ry));transition:transform .15s;display:flex;flex-direction:column;gap:8px}
.cur .c{animation:up .8s both;animation-delay:calc(var(--i)*.09s)}@keyframes up{from{opacity:0;transform:translateY(40px) rotateX(40deg)}}
.c b{font-size:18px}.c p{font-size:14px;color:var(--li)}.c.m{border-color:var(--mu)}.c.r{border-color:#ff5c8a;background:rgba(255,92,138,.08)}
.i{width:56px;height:56px;fill:none;stroke:var(--be);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 6px var(--be))}.i.y{stroke:var(--mu);filter:drop-shadow(0 0 6px var(--mu))}
.mono{font:14px 'JetBrains Mono',monospace;color:var(--li)}.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center}.node{text-align:center;font-size:13px;font-weight:600}
.tube{flex:1;min-width:200px;height:70px;border:2px solid var(--mu);border-radius:40px;display:flex;align-items:center;justify-content:center;font:13px 'JetBrains Mono',monospace;overflow:hidden;box-shadow:0 0 20px rgba(230,180,58,.3);position:relative}
.tube span{animation:sl 6s linear infinite;white-space:nowrap}@keyframes sl{from{transform:translateX(60%)}to{transform:translateX(-60%)}}
.cube{width:150px;height:150px;position:relative;transform-style:preserve-3d;animation:sp 14s linear infinite;margin:auto}@keyframes sp{to{transform:rotateX(360deg) rotateY(720deg)}}
.cube div{position:absolute;inset:0;display:grid;place-items:center;border:1px solid var(--be);background:rgba(224,64,154,.12);box-shadow:inset 0 0 30px rgba(224,64,154,.35)}
.cube div:nth-child(1){transform:translateZ(75px)}.cube div:nth-child(2){transform:rotateY(90deg) translateZ(75px)}.cube div:nth-child(3){transform:rotateY(180deg) translateZ(75px)}.cube div:nth-child(4){transform:rotateY(-90deg) translateZ(75px)}.cube div:nth-child(5){transform:rotateX(90deg) translateZ(75px)}.cube div:nth-child(6){transform:rotateX(-90deg) translateZ(75px)}
.hr{position:relative;height:56px;border-bottom:1px dashed rgba(217,198,236,.4);display:flex;align-items:flex-end;padding-bottom:6px}.hr span{font:13px 'JetBrains Mono',monospace;position:relative;z-index:1;background:var(--bg);padding:0 8px;margin:auto}
.pk{position:absolute;bottom:-6px;width:12px;height:12px;border-radius:50%;background:var(--mu);box-shadow:0 0 12px var(--mu);animation:mv 2.4s ease-in-out infinite}@keyframes mv{from{left:0}to{left:calc(100% - 12px)}}.pk.b{animation-direction:alternate-reverse}
.stamp{display:inline-block;border:3px solid #ff5c8a;color:#ff5c8a;font:700 22px 'JetBrains Mono',monospace;padding:6px 16px;transform:rotate(-5deg);border-radius:6px}
.hud{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;gap:12px;justify-content:center;align-items:center;z-index:9}
button{background:rgba(255,255,255,.08);color:var(--iv);border:1px solid var(--be);border-radius:30px;padding:8px 18px;font:inherit;cursor:pointer}button:hover{background:var(--be)}
.bar{position:fixed;top:env(safe-area-inset-top,0px);left:0;height:4px;background:linear-gradient(90deg,var(--be),var(--mu));transition:width .6s;z-index:9}
.nt{position:fixed;left:6vw;right:6vw;bottom:calc(env(safe-area-inset-bottom,0px) + 62px);background:#000c;border:1px solid var(--mu);border-radius:12px;padding:12px 16px;z-index:9;display:none;font-size:14px}.nt.on{display:block}
.q button{margin-right:8px;margin-top:6px}.ok{color:#7be0a0}.ko{color:#ff5c8a}.fr{aspect-ratio:16/9;border:2px dashed var(--mu);border-radius:16px;display:grid;place-items:center;text-align:center;background:rgba(0,0,0,.35)}a{color:var(--mu)}
</style></head><body>
<svg style="display:none"><defs>
<symbol id="ph" viewBox="0 0 64 64"><rect x="18" y="5" width="28" height="54" rx="6"/><path d="M28 10h8M24 22h16M24 30h16"/><rect x="24" y="40" width="16" height="9" rx="3"/></symbol>
<symbol id="sv" viewBox="0 0 64 64"><rect x="8" y="10" width="48" height="12" rx="3"/><rect x="8" y="26" width="48" height="12" rx="3"/><rect x="8" y="42" width="48" height="12" rx="3"/><path d="M14 16h2M14 32h2M14 48h2M44 16h8M44 32h8M44 48h8"/></symbol>
<symbol id="lk" viewBox="0 0 64 64"><rect x="12" y="28" width="40" height="30" rx="5"/><path d="M20 28V20a12 12 0 0124 0v8M32 38v10"/></symbol>
<symbol id="pe" viewBox="0 0 64 64"><circle cx="32" cy="20" r="10"/><path d="M12 58c0-14 9-22 20-22s20 8 20 22"/></symbol>
<symbol id="hk" viewBox="0 0 64 64"><path d="M14 22h36M20 22l4-12h16l4 12"/><circle cx="32" cy="34" r="9"/><path d="M26 33h4M34 33h4M12 60c0-12 8-18 20-18s20 6 20 18"/></symbol>
<symbol id="ce" viewBox="0 0 64 64"><rect x="8" y="10" width="48" height="38" rx="3"/><path d="M16 20h32M16 28h20"/><circle cx="44" cy="40" r="6"/><path d="M41 45l-2 12 5-3 5 3-2-12"/></symbol>
<symbol id="sh" viewBox="0 0 64 64"><path d="M32 6l22 8v16c0 14-9 24-22 28C19 54 10 44 10 30V14z"/><path d="M22 32l8 8 14-16"/></symbol>
<symbol id="ke" viewBox="0 0 64 64"><circle cx="20" cy="32" r="10"/><path d="M30 32h28M50 32v10M42 32v8"/></symbol>
<symbol id="cl" viewBox="0 0 64 64"><circle cx="32" cy="32" r="24"/><path d="M32 16v16l10 6"/></symbol>
</defs></svg>
<div class="bar" id="bar"></div><div class="stage" id="st"></div><div class="nt" id="nt"></div>
<div class="hud"><button onclick="go(n-1)">←</button><span class="mono" id="ct"></span><button onclick="go(n+1)">→</button><button onclick="nt.classList.toggle('on')">Notes (N)</button></div>
<script>
const I=(n,y)=>`<svg class="i ${y||''}"><use href="#${n}"/></svg>`,C=(ic,t,p,k='')=>`<div class="c ${k}">${I(ic,k=='m'?'y':'')}<b>${t}</b><p>${p}</p></div>`,N=(ic,l)=>`<div class="node">${I(ic)}<br>${l}</div>`;
const Q=[['HTTPS prouve-t-il qu\'un marchand est honnête ?',0,'Non : il protège la connexion, pas l\'honnêteté du site.'],['TLS décide-t-il si la banque accepte le paiement ?',0,'Non : c\'est la banque émettrice qui autorise.'],['Un site de hameçonnage peut-il utiliser HTTPS ?',1,'Oui : il peut obtenir un certificat valide pour son propre domaine.'],['Le successeur de SSL est-il TLS ?',1,'Oui : SSL est obsolète, TLS 1.3 est le standard actuel.']];
const hs=[['1 · ClientHello : « je veux une connexion sécurisée »',''],['2 · ServerHello + certificat','b'],['3 · Vérification du certificat · Finished',''],['4 · Clés de session dérivées : données chiffrées','b']].map(r=>`<div class="hr"><span>${r[0]}</span><i class="pk ${r[1]}"></i></div>`).join('');
const S=[
{g:'Cours · Paiement électronique',t:'',n:'Bonjour. Aujourd\'hui : ce qui protège vos paiements en ligne. Question : qui a déjà remarqué le cadenas ?',h:`<div class="row"><div style="flex:1;min-width:280px"><span class="tag">Présenté par [Prénom Nom]</span><h1>SSL / TLS</h1><h2>Comment sécuriser un <em>paiement électronique</em> ?</h2></div><div class="cube"><div>${I('lk')}</div><div>${I('ph','y')}</div><div>${I('sv')}</div><div>${I('ce','y')}</div><div>${I('sh')}</div><div>${I('ke','y')}</div></div></div>`},
{g:'Plan',t:'Le <em>plan</em>',n:'Sept étapes, de l\'introduction à la vidéo. On suit Lina tout du long.',h:`<div class="g">${['Introduction','Fonctionnalités','Avantages','Inconvénients','Utilité','Perspectives','Vidéo IA'].map((x,i)=>`<div class="c"><span class="mono" style="color:var(--mu)">0${i+1}</span><b>${x}</b></div>`).join('')}</div>`},
{g:'01 · Introduction',t:'Lina achète un sac : <em>89,900 TND</em>',n:'Lina saisit nom, adresse et carte (fictifs). Ces données traversent des réseaux qu\'elle ne contrôle pas. Question : qui peut observer ?',h:`<div class="row">${N('pe','Lina')}${N('ph','Téléphone')}<div class="mono">→ Internet →</div>${N('sv','Maison Lilas')}</div><div class="g">${C('hk','Écoute','Lire les données en transit','r')}${C('hk','Modification','89,900 devient 98,900','r')}${C('hk','Usurpation','Faux serveur','r')}${C('hk','Hameçonnage','Faux site, vrai piège','r')}</div><p class="mono">« Que se passe-t-il entre la saisie de mes données et la confirmation ? »</p>`},
{g:'01 · Introduction',t:'De SSL à <em>TLS</em>',n:'SSL (Netscape) est abandonné ; TLS 1.0 et 1.1 aussi (RFC 8996). TLS 1.2 et 1.3 sont utilisables. On dit « certificat SSL » par habitude.',h:`<div class="g">${[['SSL 2.0','abandonné','r'],['SSL 3.0','abandonné','r'],['TLS 1.0','déprécié','r'],['TLS 1.1','déprécié','r'],['TLS 1.2','encore utilisé',''],['TLS 1.3','standard actuel','m']].map(x=>C('cl',x[0],x[1],x[2])).join('')}</div><span class="stamp">SSL = OBSOLÈTE</span>`},
{g:'01 · Introduction',t:'HTTP + TLS = <em>HTTPS</em>',n:'HTTPS = HTTP dans un tunnel TLS. L\'espion voit du trafic, pas le contenu. Le texte chiffré est fictif.',h:`<div class="row">${N('pe','Lina')}<div class="tube"><span>HTTP · POST montant=89,900 TND · tunnel TLS · 7f3a 9c01 e2b8 4d6f</span></div>${N('sv','Serveur')}</div><div class="row">${N('hk','Espion')}<p class="mono">« Je vois du trafic, mais je ne peux pas le lire. » (illustration fictive)</p></div>`},
{g:'02 · Fonctionnalités',t:'3 objectifs de <em>sécurité</em>',n:'Confidentialité, intégrité, authentification. Question : lequel répond au faux serveur ?',h:`<div class="g">${C('lk','Confidentialité','Personne ne lit la carte de Lina en transit.')}${C('sh','Intégrité','89,900 ne devient pas 98,900 sans détection.','m')}${C('ce','Authentification','Le navigateur vérifie maison-lilas.example.')}</div>`},
{g:'02 · Fonctionnalités',t:'Cryptographie : les <em>clés</em>',n:'Asymétrique : paire publique/privée, authentification et établissement de clés. Symétrique : clé de session partagée, rapide, protège les données après le handshake.',h:`<div class="row"><div class="c">Message clair<br><span class="mono">Montant : 89,900 TND</span></div>${I('ke','y')}<div class="c">Texte chiffré<br><span class="mono">7f3a 9c01 e2b8…</span></div></div><div class="g">${C('ke','Asymétrique','Clé publique + clé privée. Authentifie, aide à établir des clés partagées. Plus lent.')}${C('lk','Symétrique','Clé de session partagée. Chiffre les données après le handshake. Rapide.','m')}</div>`},
{g:'02 · Fonctionnalités',t:'Certificat et <em>autorité</em> (AC)',n:'Le certificat lie un domaine à une clé publique, signé par une AC. Valide pour boutique.example, mais Lina visite boutique-exemple.example : alerte. Pas un label d\'honnêteté.',h:`<div class="g"><div class="c m">${I('ce','y')}<b>CERTIFICAT (fictif)</b><p class="mono">Domaine : maison-lilas.example<br>Clé publique : 04 A9 7F…<br>Émetteur : AC Exemple<br>Validité : début → fin<br>Signature : de l'AC</p></div><div class="c r"><b>⚠ Domaine différent</b><p>Valide pour boutique.example<br>Lina visite boutique-exemple.example</p></div>${C('sh','Chaîne de confiance','Navigateur → site → AC reconnue')}</div>`},
{g:'02 · Fonctionnalités',t:'Le handshake <em>TLS 1.3</em>',n:'Le client propose, le serveur répond avec son certificat et la preuve de la clé privée. Les deux dérivent des clés de session (Diffie-Hellman) : la clé n\'est pas simplement envoyée.',h:`<div class="row" style="justify-content:space-between">${N('pe','CLIENT')}${N('sv','SERVEUR')}</div>${hs}`},
{g:'02 · Fonctionnalités',t:'L\'homme <em>du milieu</em>',n:'Sans authentification valide, l\'attaquant s\'interpose. Avec TLS, certificat et intégrité rendent l\'attaque détectable.',h:`<div class="row">${N('pe','Lina')}<span class="mono">——</span>${N('hk','Attaquant')}<span class="mono">——</span>${N('sv','Serveur')}<span class="stamp">sans TLS</span></div><div class="row">${N('pe','Lina')}<span class="mono">—</span>${I('lk','y')}<span class="mono">—</span>${N('sv','Serveur')}<span class="mono" style="color:#7be0a0">avec TLS : domaine vérifié, données protégées</span></div>`},
{g:'03 · Avantages',t:'Les <em>avantages</em>',n:'Chaque avantage correspond à un moment du parcours de Lina.',h:`<div class="g">${C('lk','Confidentialité','Carte illisible pendant la saisie envoyée')}${C('sh','Intégrité','Montant protégé jusqu\'au serveur','m')}${C('ce','Authentification','Domaine vérifié avant de payer')}${C('sv','Standard universel','Navigateurs et serveurs compatibles','m')}${C('pe','Confiance','Le cadenas rassure (sans prouver l\'honnêteté)')}</div>`},
{g:'04 · Inconvénients',t:'Les <em>limites</em>',n:'TLS ne protège pas contre hameçonnage, appareil infecté, serveur compromis, marchand malveillant. Surcoût modeste avec TLS 1.3.',h:`<div class="g">${[['hk','Hameçonnage','Faux site avec cadenas'],['ph','Appareil infecté','TLS s\'arrête aux extrémités'],['sv','Serveur compromis','Vol après réception'],['ce','Certificats','Expiration, renouvellement'],['ke','Configuration','Anciens protocoles actifs'],['cl','Performance','Surcoût réduit en TLS 1.3']].map(x=>C(x[0],x[1],x[2],'r')).join('')}</div><span class="stamp">TLS ≠ SÉCURITÉ ABSOLUE</span>`},
{g:'05 · Utilité',t:'Où TLS <em>protège</em> le paiement',n:'TLS protège chaque liaison où il est utilisé. L\'autorisation revient à la banque.',h:`<div class="row">${N('pe','Lina')}${N('ph','Navigateur / app')}${I('lk','y')}${N('sv','Marchand')}${I('lk','y')}${N('ce','Prestataire')}${N('sh','Banque : autorise')}</div><div class="g">${C('sv','Boutiques en ligne','')}${C('ke','API de paiement','')}${C('ph','Applications mobiles','')}${C('sh','Banque en ligne','')}</div>`},
{g:'06 · Perspectives',t:'<em>Perspectives</em>',n:'TLS 1.3 actuel ; certificats automatisés ; tokenisation et authentification forte complètent TLS ; post-quantique en cours de standardisation.',h:`<div class="g">${C('cl','TLS 1.3','Handshake simplifié, anciens mécanismes retirés')}${C('ce','Certificats automatisés','Renouvellement sans intervention (ACME)','m')}${C('ke','Tokenisation','La carte n\'est plus exposée en clair')}${C('sh','Authentification forte','Complète TLS, ne le remplace pas','m')}${C('lk','Post-quantique','Standardisation et migration progressives')}</div>`},
{g:'07 · Vidéo IA',t:'Derrière <em>l\'écran</em>',n:'Lancer la vidéo (45-60 s) ; sinon ouvrir le lien. Scènes : boutique, connexion, certificat, données chiffrées, paiement, reçu. Conclusion : « TLS protège le trajet ; la sécurité repose aussi sur d\'autres couches. »',h:`<div class="fr" style="position:relative;overflow:hidden"><iframe src="https://docs.google.com/videos/d/1gQSQ0pSck7DZzvUVQ1BuSIy4jIVRoLceKQ1A6Izj_Xo/play?usp=sharing" allow="autoplay; fullscreen" allowfullscreen style="position:absolute;inset:0;width:100%;height:100%;border:0"></iframe></div><p class="mono" style="text-align:center">Si la vidéo ne se lance pas ici : <a href="https://docs.google.com/videos/d/1gQSQ0pSck7DZzvUVQ1BuSIy4jIVRoLceKQ1A6Izj_Xo/play?usp=sharing" target="_blank" rel="noopener">ouvrir la vidéo dans un nouvel onglet</a></p><div class="g">${['Lina ouvre la boutique','Connexion protégée demandée','Certificat vérifié','Données chiffrées, espion perdu','Prestataire et banque','Reçu + message final'].map((x,i)=>`<div class="c"><span class="mono" style="color:var(--mu)">Scène ${i+1}</span><p>${x}</p></div>`).join('')}</div>`},
{g:'Quiz',t:'À <em>vous</em> !',n:'Réponses : 1 Non. 2 Non. 3 Oui. 4 Oui. Laissez répondre avant de cliquer.',h:`<div class="g">${Q.map((q,i)=>`<div class="c q"><b>${q[0]}</b><div><button onclick="an(this,1,${i})">Oui</button><button onclick="an(this,0,${i})">Non</button></div><p></p></div>`).join('')}</div>`},
{g:'Conclusion',t:'À <em>retenir</em>',n:'SSL historique, TLS standard, HTTPS = HTTP + TLS, TLS protège le transport, un paiement sûr repose sur plusieurs couches. Vérifiez les liens avant de présenter.',h:`<div class="g">${C('cl','SSL est historique','TLS est le standard actuel.')}${C('lk','HTTPS = HTTP + TLS','Le cadenas protège le transport.','m')}${C('sh','Plusieurs couches','TLS ne suffit pas à sécuriser tout un paiement.')}</div><p class="mono">Références : <a href="https://www.rfc-editor.org/rfc/rfc8446" target="_blank">RFC 8446</a> · <a href="https://www.rfc-editor.org/rfc/rfc9110" target="_blank">RFC 9110</a> · <a href="https://developer.mozilla.org/en-US/docs/Web/Security/Transport_Layer_Security" target="_blank">MDN TLS</a> · <a href="https://cheatsheetseries.owasp.org/cheatsheets/Transport_Layer_Security_Cheat_Sheet.html" target="_blank">OWASP</a> · <a href="https://www.pcisecuritystandards.org" target="_blank">PCI SSC</a></p>`}];
const st=document.getElementById('st'),nt=document.getElementById('nt');let n=0;
S.forEach(s=>{const e=document.createElement('section');e.className='slide';e.innerHTML=`<div class="in"><span class="tag">${s.g}</span>${s.t?`<h2>${s.t}</h2>`:''}${s.h}</div>`;e.querySelectorAll('.c').forEach((c,i)=>c.style.setProperty('--i',i));st.appendChild(e)});
function go(k){try{n=Math.max(0,Math.min(S.length-1,k));[...st.children].forEach((e,i)=>e.className='slide '+(i<n?'prev':i>n?'next':'cur'));bar.style.width=(n+1)/S.length*100+'%';ct.textContent=(n+1)+' / '+S.length;nt.textContent=S[n].n}catch(e){}}
function an(b,v,i){const p=b.parentNode.nextElementSibling,ok=v==Q[i][1];p.className=ok?'ok':'ko';p.textContent=(ok?'Bravo. ':'Pas tout à fait. ')+Q[i][2]}
document.onkeydown=e=>{if(e.key=='ArrowRight'||e.key==' ')go(n+1);if(e.key=='ArrowLeft')go(n-1);if(e.key=='n'||e.key=='N')nt.classList.toggle('on')};
let x0;document.ontouchstart=e=>x0=e.touches[0].clientX;document.ontouchend=e=>{const d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>70)go(n+(d<0?1:-1))};
document.onmousemove=e=>{const c=e.target.closest&&e.target.closest('.c');if(c){const r=c.getBoundingClientRect();c.style.setProperty('--ry',((e.clientX-r.left)/r.width-.5)*14+'deg');c.style.setProperty('--rx',-((e.clientY-r.top)/r.height-.5)*14+'deg')}};
